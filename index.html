/* ---- LEVEL GAMEPLAY ----------------------------------------------------------
   Phases:  enter (door opens) -> play -> exit (gate reached) or dead          */
const Camera = { x: 0 };

STATES.level = {
  enter(levelId) {
    this.def = LEVEL_BY_ID[levelId];
    this.level = parseLevel(this.def);
    this.restart();
  },
  restart() {
    const L = this.level;
    this.phase = 'enter'; this.phaseT = 0; this.exitCalled = false; this.exitOK = false;
    this.usedExit = null; this.usedSecret = false;       // which gate the player walked into
    this.collected = 0;
    L.coins.forEach(c => c.got = false);
    this.enemies = L.enemies.map(s => ({ x: s.col * TILE + 1, y: (s.row + 1) * TILE - 14, w: 14, h: 14,
                                         vx: -0.5, vy: 0, alive: true, deadT: 0, onGround: false }));
    this.particles = [];
    Player.colorIdx = Save.color; Player.faceIdx = Save.face;
    resetPlayer(L);
    Camera.x = this.camTarget();
  },
  total() { return this.level.coins.length; },
  pct()   { return this.total() ? Math.floor(this.collected / this.total() * 100) : 100; },
  camTarget() {
    return clamp(Math.round(Player.x + Player.w / 2 - SCREEN_W / 2), 0, this.level.w * TILE - SCREEN_W);
  },
  kill() {
    this.phase = 'dead'; this.phaseT = 0;
    Player.vy = -4.5; Game.deaths++;
    spawnBurst(this.particles, Player.x + 7, Player.y + 7, PLAYER_COLORS[Save.color][0], 14, 2.5, 30);
    Sfx.die();
  },
  update() {
    const L = this.level, p = Player;
    this.phaseT++;
    updateParticles(this.particles);

    if (this.phase === 'enter') {
      if (this.phaseT > 30) { this.phase = 'play'; this.phaseT = 0; }
      return;
    }

    if (this.phase === 'dead') {
      p.vy = Math.min(p.vy + 0.3, 6); p.y += p.vy;                  // the square tumbles off the screen
      if (this.phaseT > 70 && !this.exitCalled) { this.exitCalled = true; fadeTo(() => this.restart()); }
      return;
    }

    if (this.phase === 'exit') {
      if (this.exitOK) {
        if (this.phaseT > 45 && !this.exitCalled) {
          this.exitCalled = true;
          const info = { levelId: L.id, name: L.name, collected: this.collected, total: this.total(), secret: this.usedSecret };
          fadeTo(() => changeState('tally', info));
        }
      } else if (this.phaseT > 100 && !this.exitCalled) {            // red flash is over -> back to the map
        this.exitCalled = true;
        fadeTo(() => changeState('map'));
      }
      return;
    }

    // ---- phase 'play' ----
    if (Input.pressed('back')) { fadeTo(() => changeState('map')); return; }

    updatePlayer(L);
    for (const e of this.enemies) updateEnemy(e, L);

    // coins
    for (const c of L.coins) {
      if (c.got) continue;
      if (aabb(p.x, p.y, p.w, p.h, c.col * TILE + 3, c.row * TILE + 3, 10, 10)) {
        c.got = true; this.collected++; Sfx.coin();
        spawnBurst(this.particles, c.col * TILE + 8, c.row * TILE + 8, C.yellow, 6, 1.5, 18);
      }
    }

    // enemies: stomp from above to defeat, touch from the side to die
    for (const e of this.enemies) {
      if (!e.alive || !aabb(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) continue;
      if (p.vy > 0 && p.y + p.h < e.y + e.h * 0.6) {
        e.alive = false; e.deadT = 24;
        p.vy = Input.down('jump') ? -PHYS.STOMP_BOUNCE_HELD : -PHYS.STOMP_BOUNCE;
        p.onGround = false; Sfx.stomp();
        spawnBurst(this.particles, e.x + 7, e.y + 10, C.purple, 8, 1.8, 20);
      } else { this.kill(); return; }
    }

    if (touchesHazard(L, p) || p.y > L.h * TILE) { this.kill(); return; }

    // the exit gates: the normal one (E) and any secret ones (%) - both follow the same coin rule
    const gates = [{ g: L.exit, secret: false }].concat(L.secretExits.map(g => ({ g, secret: true })));
    for (const gate of gates) {
      const gx = gate.g.col * TILE + 2, gy = (gate.g.row + 1) * TILE - 28;
      if (!aabb(p.x, p.y, p.w, p.h, gx, gy, 12, 28)) continue;
      this.phase = 'exit'; this.phaseT = 0;
      this.usedExit = gate.g; this.usedSecret = gate.secret;
      this.exitOK = this.total() === 0 || this.collected / this.total() >= CLEAR_PERCENT / 100 - 1e-9;
      if (this.exitOK) Sfx.star(); else Sfx.fail();      // under 40% -> the gate flashes red
      break;
    }

    Camera.x += (this.camTarget() - Camera.x) * 0.2;      // smooth camera
  },
  draw() {
    const L = this.level, p = Player, camX = Math.round(Camera.x);
    drawBackground(L.theme, camX);

    // --- tiles (only the ones on screen) ---
    const sheet = SHEETS[L.theme];
    const c0 = Math.max(0, Math.floor(camX / TILE)), c1 = Math.min(L.w - 1, c0 + 17);
    for (let r = 0; r < L.h; r++) for (let c = c0; c <= c1; c++) {
      const ch = L.grid[r][c];
      if (ch === '.') continue;
      const px = c * TILE - camX, py = r * TILE;
      if (ch === '#') {
        const v = L.variant[r][c];
        ctx.drawImage(sheet.ground[v.mask], px, py);
        if (v.diag & D_TL) rect(px, py, 3, 3, C.topDark);            // inside-corner notches
        if (v.diag & D_TR) rect(px + 13, py, 3, 3, C.topDark);
        if (v.diag & D_BR) rect(px + 13, py + 13, 3, 3, THEMES[L.theme].edge);
        if (v.diag & D_BL) rect(px, py + 13, 3, 3, THEMES[L.theme].edge);
      } else if (ch === 'B') ctx.drawImage(sheet.brick, px, py);
        else if (ch === '-') ctx.drawImage(sheet.platform[L.variant[r][c]], px, py);
        else if (ch === '^') ctx.drawImage(sheet.spikes, px, py);
        else if (ch === 'v') ctx.drawImage(sheet.ceilingSpikes, px, py);
    }

    // --- gates ---
    const s = L.start, ex = L.exit;
    drawGate(s.col * TILE - camX, (s.row + 1) * TILE, 'entry', this.phase === 'enter' ? 'open' : 'closed');
    // only the gate the player actually walked into flashes gold (cleared) or red (not enough coins)
    const gateState = g => (this.phase === 'exit' && this.usedExit === g) ? (this.exitOK ? 'gold' : 'red') : 'closed';
    drawGate(ex.col * TILE - camX, (ex.row + 1) * TILE, 'exit', gateState(ex));
    for (const sg of L.secretExits) drawGate(sg.col * TILE - camX, (sg.row + 1) * TILE, 'secret', gateState(sg));

    // --- coins, enemies, player ---
    for (const c of L.coins) if (!c.got) drawCoinSprite(c.col * TILE + 8 - camX, c.row * TILE + 8, c.col);
    for (const e of this.enemies) if (e.alive || e.deadT > 0) drawEnemySprite(e, camX);
    const hidePlayer = this.phase === 'exit' && this.exitOK && this.phaseT > 12;
    if (!hidePlayer && !(this.phase === 'dead' && this.phaseT < 2)) {
      drawPlayerSprite(p.x - camX, p.y, p.w, p.h, Save.color, Save.face, p.facing, p.sx, p.sy);
    }
    drawParticles(this.particles, camX);

    // --- HUD: coin count, percentage, progress bar with star marks ---
    ctx.globalAlpha = 0.65; rect(0, 0, SCREEN_W, 21, C.black); ctx.globalAlpha = 1;
    rect(6, 3, 6, 7, C.gold); rect(7, 4, 4, 5, C.yellow);
    drawText(this.collected + '/' + this.total(), 16, 4, C.white, 1);
    drawText(this.pct() + '%', 128, 4, this.pct() >= CLEAR_PERCENT ? C.yellow : C.white, 1, 'center');
    drawText(L.id, 250, 4, C.white, 1, 'right');
    rect(5, 13, 102, 6, C.black); rect(6, 14, 100, 4, C.dkgrey);
    rect(6, 14, Math.min(100, this.pct()), 4, this.pct() >= 100 ? C.yellow : C.green);
    rect(6 + CLEAR_PERCENT, 12, 1, 8, C.red);                          // the 40% line
    for (const st of STAR_STEPS) rect(6 + st, 13, 1, 6, C.white);       // star marks
    drawText('NEED ' + CLEAR_PERCENT + '%', 112, 14, C.grey, 1);

    // --- messages ---
    if (this.phase === 'enter' || (this.phase === 'play' && this.phaseT < 60)) {
      drawText(L.id + ' ' + L.name, 128, 90, C.white, 2, 'center');
    }
    if (this.phase === 'exit' && !this.exitOK) {
      drawText('NEED ' + CLEAR_PERCENT + '% COINS!', 128, 90, C.red, 2, 'center');
      drawText('TRY AGAIN', 128, 112, C.white, 1, 'center');
    }
  },
  drawDebug() {
    const L = this.level, p = Player, camX = Math.round(Camera.x);
    const box = (x, y, w, h, col) => { rect(x, y, w, 1, col); rect(x, y + h - 1, w, 1, col); rect(x, y, 1, h, col); rect(x + w - 1, y, 1, h, col); };
    const pc = Math.floor(p.x / TILE), pr = Math.floor(p.y / TILE);
    ctx.globalAlpha = 0.6;
    for (let r = pr - 3; r <= pr + 3; r++) for (let c = pc - 4; c <= pc + 4; c++) {   // solid tiles near the player
      if (isSolid(tileAt(L, c, r)) && c >= 0 && c < L.w && r >= 0 && r < L.h) box(c * TILE - camX, r * TILE, TILE, TILE, C.cyan);
    }
    ctx.globalAlpha = 1;
    for (const c of L.coins) if (!c.got) box(c.col * TILE + 3 - camX, c.row * TILE + 3, 10, 10, C.yellow);
    for (const e of this.enemies) if (e.alive) box(Math.round(e.x) - camX, Math.round(e.y), e.w, e.h, C.red);
    box(L.exit.col * TILE + 2 - camX, (L.exit.row + 1) * TILE - 28, 12, 28, C.purple);
    for (const sg of L.secretExits) box(sg.col * TILE + 2 - camX, (sg.row + 1) * TILE - 28, 12, 28, C.orange);
    box(Math.round(p.x) - camX, Math.round(p.y), p.w, p.h, C.green);               // player hitbox
    const lines = [
      'X ' + p.x.toFixed(2) + '  Y ' + p.y.toFixed(2),
      'VX ' + p.vx.toFixed(2) + '  VY ' + p.vy.toFixed(2),
      'GROUND ' + (p.onGround ? 'YES' : 'NO') + '  WALL ' + p.wallSide + '  LOCK ' + p.edgeLock,
      'COINS ' + this.collected + '/' + this.total() + '  ' + this.pct() + '%',
      'PHASE ' + this.phase + '  DEATHS ' + Game.deaths
    ];
    lines.forEach((t, i) => drawText(t, 4, 26 + i * 7, C.yellow, 1));
  }
};

/* ---- POST-LEVEL TALLY ----------------------------------------------------------
   Coins count DOWN like a timer while the percentage counts UP. Stars light
   up silver when the percentage passes 60/80/90 - and ALL turn gold at 100%. */
STATES.tally = {
  enter(info) {
    this.info = info;
    this.remaining = info.collected; this.shown = 0; this.acc = 0; this.t = 0;
    this.done = false; this.doneT = 0; this.lastStars = 0; this.confetti = [];
    const hiddenBefore = countHiddenNodes();                          // to spot newly revealed secrets
    const pct = info.total ? Math.floor(info.collected / info.total * 100) : 100;
    Save.cleared[info.levelId] = true;                              // unlocks the next map nodes
    Save.best[info.levelId] = Math.max(Save.best[info.levelId] || 0, pct);
    if (info.secret) Save.secret[info.levelId] = true;               // remember the secret exit was found
    Save.store();
    this.secretMsg = countHiddenNodes() < hiddenBefore ? 'A SECRET PATH APPEARED!' : '';
  },
  pct() { return this.info.total ? Math.floor(this.shown / this.info.total * 100) : 100; },
  update() {
    this.t++;
    updateParticles(this.confetti);
    if (!this.done) {
      if (Input.pressed('start') || Input.pressed('jump')) { this.shown = this.info.collected; this.remaining = 0; }   // skip
      else if (this.t > 30) {
        this.acc += Math.max(0.15, this.info.collected / 150);          // whole animation takes ~2.5 seconds
        while (this.acc >= 1 && this.remaining > 0) { this.acc -= 1; this.remaining--; this.shown++; if (this.shown % 2 === 0) Sfx.tick(); }
      }
      const lit = [0, 1, 2].filter(i => starKind(this.pct(), i) > 0).length;
      if (lit > this.lastStars) { this.lastStars = lit; Sfx.star(); }
      if (this.remaining <= 0 && this.t > 30) {
        this.done = true; this.doneT = 0;
        if (this.pct() >= 100) for (let i = 0; i < 4; i++) spawnBurst(this.confetti, 128, 150, [C.yellow, C.cyan, C.red, C.green][i], 18, 3, 50);
      }
    } else {
      this.doneT++;
      if (this.pct() >= 100 && this.doneT % 25 === 0) spawnBurst(this.confetti, 60 + Math.random() * 140, 120, [C.yellow, C.white, C.orange][this.doneT % 3], 10, 2, 40);
      if (this.doneT > 20 && (Input.pressed('start') || Input.pressed('jump'))) {
        const msg = this.secretMsg;
        fadeTo(() => changeState('map', { message: msg }));
      }
    }
  },
  draw() {
    rect(0, 0, SCREEN_W, SCREEN_H, C.black);
    for (let y = 0; y < SCREEN_H; y += 16) for (let x = (y / 16 % 2) * 16; x < SCREEN_W; x += 32) rect(x, y, 16, 16, C.dkgrey === C.black ? C.black : '#16162a');
    rect(14, 14, 228, 212, C.dkgrey); rect(16, 16, 224, 208, C.black);
    drawText(this.info.secret ? 'SECRET EXIT!' : 'LEVEL CLEAR!', 128, 26, this.info.secret ? C.cyan : C.yellow, 2, 'center');
    drawText(this.info.levelId + ' ' + this.info.name, 128, 46, C.white, 1, 'center');
    // coin timer counting DOWN
    rect(78, 66, 8, 10, C.gold); rect(79, 67, 6, 8, C.yellow); rect(80, 68, 1, 3, C.white);
    drawText('COINS LEFT ' + this.remaining, 94, 68, C.white, 1);
    drawText('OF ' + this.info.total, 94, 78, C.grey, 1);
    // percentage counting UP
    const pct = this.pct();
    drawText(pct + '%', 128, 94, pct >= 100 ? C.yellow : C.white, 5, 'center');
    // the three stars
    for (let i = 0; i < 3; i++) {
      const bounce = (this.done && starKind(pct, i) === 2) ? Math.round(Math.sin(this.doneT / 6 + i) * 2) : 0;
      drawStar(70 + i * 46, 138 + bounce, starKind(pct, i), 3);
      drawText(STAR_STEPS[i] + '%', 83 + i * 46, 170, starKind(pct, i) ? C.white : C.grey, 1, 'center');
    }
    drawText(this.done ? (pct >= 100 ? 'PERFECT! GOLD STARS!' : (pct >= STAR_STEPS[0] ? 'NICE COLLECTING!' : 'CLEARED!')) : 'COUNTING...', 128, 186, pct >= 100 ? C.yellow : C.white, 1, 'center');
    drawText('BEST ' + Math.max(Save.best[this.info.levelId] || 0, 0) + '%', 128, 198, C.grey, 1, 'center');
    if (this.done && blink()) drawText('PRESS ENTER', 128, 210, C.cyan, 1, 'center');
    drawParticles(this.confetti);
  }
};


/* =========================================================================
   8. MAIN LOOP
   -------------------------------------------------------------------------
   Logic runs in fixed 1/60 second steps (so physics is identical on every
   computer); drawing happens once per screen refresh.
   ========================================================================= */

function update() {
  Game.tick++;
  if (Input.pressed('debug')) Game.debug = !Game.debug;
  if (Input.pressed('mute'))  Sfx.mute = !Sfx.mute;
  if (!updateFade()) Game.state.update();
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  Game.state.draw();
  drawFade();
  if (Game.debug) {
    if (Game.state.drawDebug) Game.state.drawDebug();
    rect(0, 232, 120, 8, C.black);
    drawText('DEBUG  ' + Game.name.toUpperCase() + '  ' + Math.round(Game.fps) + 'FPS', 2, 233, C.green, 1);
  }
}

// Resize the canvas to the biggest WHOLE-NUMBER scale that fits the window.
function resize() {
  const scale = Math.max(1, Math.floor(Math.min(window.innerWidth / SCREEN_W, window.innerHeight / SCREEN_H)));
  canvas.style.width  = Math.round(SCREEN_W * scale * (STRETCH_TO_4_3 ? 8 / 7 : 1)) + 'px';
  canvas.style.height = (SCREEN_H * scale) + 'px';
}

let lastTime = 0, accumulator = 0, fpsFrames = 0, fpsTime = 0;
function frame(now) {
  accumulator += Math.min(now - lastTime, 100);      // clamp so a background tab can't cause a huge catch-up
  lastTime = now;
  while (accumulator >= STEP_MS) { update(); Input.endFrame(); accumulator -= STEP_MS; }
  draw();
  fpsFrames++;
  if (now - fpsTime >= 500) { Game.fps = fpsFrames * 1000 / (now - fpsTime); fpsFrames = 0; fpsTime = now; }
  requestAnimationFrame(frame);
}

function init() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  Input.init();
  buildSheets();
  Save.load();
  applyControls(Save.controls);                      // arrows or WASD, whichever was saved
  window.addEventListener('resize', resize);
  resize();
  changeState('title');
  lastTime = fpsTime = performance.now();
  requestAnimationFrame(frame);
}
init();
</script>
